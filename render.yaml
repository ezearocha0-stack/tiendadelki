# ==============================================================================
# RENDER BLUEPRINT - TIENDADELKI BACKEND / API (100% GRATUITO - PLAN FREE)
# ==============================================================================
# Documentación oficial: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tiendadelki-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "npm start"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: ./public/uploads
      - key: PRIVATE_STORAGE_DIR
        value: ./storage/private
      - key: COOKIE_NAME
        value: td_auth_token
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        value: ""
      # ==========================================================================
      # VARIABLES SECRETAS OBLIGATORIAS (Configurar en Render Dashboard):
      # Las variables con sync: false se administran directamente en el panel
      # de Render y nunca se exponen ni sobrescriben desde el repositorio Git.
      # ==========================================================================
      # Conexión Render PostgreSQL (Internal Database URL para runtime seguro y rápido):
      - key: DATABASE_URL
        sync: false
      # Conexión Render PostgreSQL (Directa / Idéntica a DATABASE_URL en Render PostgreSQL):
      - key: DIRECT_URL
        sync: false
      # Clave criptográfica para firmas JWT (mínimo 32 caracteres, idéntica a Vercel):
      - key: JWT_SECRET
        sync: false
      # URL pública canónica del frontend en Vercel:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Dominios de frontend autorizados para CORS:
      - key: ALLOWED_ORIGINS
        sync: false
      # Credenciales del Administrador Inicial (para seed en desarrollo/primera ejecución):
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false
