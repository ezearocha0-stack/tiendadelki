# ==============================================================================
# RENDER BLUEPRINT - TIENDADELKI PRODUCCIÓN (FULLSTACK + PERSISTENT DISK)
# ==============================================================================
# Documentación oficial: https://render.com/docs/blueprint-spec

databases:
  - name: tiendadelki-db
    databaseName: tiendadelki_prod
    user: tiendadelki_user
    plan: starter
    region: oregon
    postgresMajorVersion: 16

services:
  - type: web
    name: tiendadelki-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "npx prisma migrate deploy && npm start"
    healthCheckPath: /api/health
    disk:
      name: tiendadelki-uploads
      mountPath: /data/tiendadelki
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: tiendadelki-db
          property: connectionString
      - key: COOKIE_NAME
        value: td_auth_token
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: /data/tiendadelki/uploads
      - key: PRIVATE_STORAGE_DIR
        value: /data/tiendadelki/storage_private
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        value: "8296734710"
      # ==========================================================================
      # VARIABLES SECRETAS OBLIGATORIAS (Configurar en Render Dashboard):
      # ==========================================================================
      # - JWT_SECRET: Clave criptográfica de 64 caracteres (openssl rand -hex 32)
      # - NEXT_PUBLIC_SITE_URL: URL pública final de Render (ej. https://tiendadelki-backend.onrender.com)
      #   o tu dominio personalizado (ej. https://tiendadelki.com).
      # ==========================================================================
