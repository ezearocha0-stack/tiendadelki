# ==============================================================================
# RENDER BLUEPRINT - TIENDADELKI BACKEND / API (NEON POSTGRESQL + PERSISTENT DISK)
# ==============================================================================
# Documentación oficial: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tiendadelki-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "npx prisma migrate deploy && npm start"
    healthCheckPath: /api/health
    disk:
      name: tiendadelki-uploads
      mountPath: /data/tiendadelki
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: /data/tiendadelki/uploads
      - key: PRIVATE_STORAGE_DIR
        value: /data/tiendadelki/storage_private
      - key: COOKIE_NAME
        value: td_auth_token
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        value: "8296734710"
      # ==========================================================================
      # VARIABLES SECRETAS OBLIGATORIAS (Configurar en Render Dashboard):
      # ==========================================================================
      # - DATABASE_URL: URL de conexión de Neon PostgreSQL (ej. postgresql://user:pass@ep-xyz.us-east-2.aws.neon.tech/neondb?sslmode=require)
      # - JWT_SECRET: Clave criptográfica de 64 caracteres (openssl rand -hex 32)
      # - NEXT_PUBLIC_SITE_URL: URL pública del frontend en Vercel (ej. https://tiendadelki.vercel.app o dominio propio)
      # - ALLOWED_ORIGINS: Dominio del frontend de Vercel autorizado para CORS (ej. https://tiendadelki.vercel.app)
      # - INITIAL_ADMIN_EMAIL: Correo para el administrador inicial (ej. admin@tiendadelki.com)
      # - INITIAL_ADMIN_PASSWORD: Contraseña para el administrador inicial (mínimo 8 caracteres)
      # ==========================================================================
