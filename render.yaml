# ==============================================================================
# RENDER BLUEPRINT - TIENDADELKI BACKEND / API (NEON POSTGRESQL + PERSISTENT DISK)
# ==============================================================================
# Documentación oficial: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: tiendadelki-backend
    runtime: node
    region: oregon
    plan: starter
    buildCommand: "npm install && npx prisma generate && npm run build"
    startCommand: "npx prisma migrate deploy && npm start"
    healthCheckPath: /api/health
    disk:
      name: tiendadelki-uploads
      mountPath: /data/tiendadelki
      sizeGB: 10
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: STORAGE_PROVIDER
        value: local
      - key: UPLOAD_DIR
        value: /data/tiendadelki/uploads
      - key: PRIVATE_STORAGE_DIR
        value: /data/tiendadelki/storage_private
      - key: COOKIE_NAME
        value: td_auth_token
      - key: NEXT_PUBLIC_WHATSAPP_PHONE
        value: "8296734710"
      # ==========================================================================
      # VARIABLES SECRETAS OBLIGATORIAS (Configurar en Render Dashboard):
      # Las variables con sync: false se administran directamente en el panel
      # de Render y nunca se exponen ni sobrescriben desde el repositorio Git.
      # ==========================================================================
      # Conexión Neon PostgreSQL (Pooled / PgBouncer para runtime de la aplicación):
      - key: DATABASE_URL
        sync: false
      # Conexión Neon PostgreSQL (Directa / Unpooled para migraciones Prisma):
      - key: DIRECT_URL
        sync: false
      # Clave criptográfica para firmas JWT (mínimo 32 caracteres):
      - key: JWT_SECRET
        sync: false
      # URL pública canónica del frontend en Vercel:
      - key: NEXT_PUBLIC_SITE_URL
        sync: false
      # Dominios de frontend autorizados para CORS:
      - key: ALLOWED_ORIGINS
        sync: false
      # Credenciales del Administrador Inicial (para seed en primera ejecución):
      - key: INITIAL_ADMIN_EMAIL
        sync: false
      - key: INITIAL_ADMIN_PASSWORD
        sync: false

